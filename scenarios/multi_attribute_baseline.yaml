# Multi-attribute negotiation baseline (Problem-07, adversarial FAIL demo).
#
# Identical to `chainaim_multi_attribute_market.yaml` EXCEPT `layers.negotiation` is the
# single-attribute reference plugin `alternating_offers`. That plugin reads only
# `price` and accepts on its round cap, ignoring the `deadline` attribute -- so it
# settles on a price-only deal that a *feasible* logrolling point Pareto-dominates
# (better on deadline for one party without being worse for the other). Because a
# symmetric price-only run only ever exchanges offers that form a Pareto antichain,
# the exchanged-offers check (`negotiation_pareto_efficient`) cannot catch this; the
# feasible-frontier check (`negotiation_frontier_efficient`), which reconstructs the
# outcome space from the disclosed weights/bounds, reports FAIL. The agents still
# disclose their private weights and exchange price+deadline offers, so the validator
# can recompute both parties' utilities. The FAIL here is the *correct* result --
# spec criterion 4. Per-pair weights are seeded from the RNG (SC5).
name: multi_attribute_baseline
description: "Same market via single-attribute alternating_offers (adversarial FAIL demo)."

tier: 1
seed: 42

agents:
  count: 20
  brain: state-machine
  roles:
    - name: buyer
      count: 10
    - name: seller
      count: 10

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: negotiation_multi
  config:
    price_min: 30
    price_max: 100
    # `deadline` = buyer's SETTLEMENT WINDOW (net-30/60): buyer wants it long (keep cash longer),
    # seller short (collect sooner). DELIVERY-lead-time reading (signs flipped): see
    # scenarios/multi_attribute_leadtime.yaml. Kept identical to market.yaml here.
    deadline_min: 1
    deadline_max: 30
    buyer_open_price: 30
    buyer_open_deadline: 30
    seller_anchor: 95
    buyer_target: 70
    seller_target: 60
    naive_deadline: 15
    price_step: 5
    patience: 0.9
    max_rounds: 12
    # buyer_w_price / seller_w_price intentionally omitted -> _pair_weights seeds
    # per-pair weights from `seed` (SC5). Kept identical to the market scenario so
    # the two differ ONLY in layers.negotiation.

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - success_rate
  - mean_latency
  - message_count

output:
  trace: ./traces/multi_attribute_baseline.jsonl
